<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniMath Solver — Scientific & Symbolic Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Extra.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--soft:#f8fafc;--fg:#172033;--muted:#64748b;--line:#e2e8f0;--accent:#4263eb;--accent2:#eef2ff;--good:#059669;--bad:#dc2626;--shadow:0 8px 28px #18233a0c}
:root.dark{--bg:#0c1220;--card:#151e2e;--soft:#1c293d;--fg:#edf2fa;--muted:#a3b1c6;--line:#2b3a52;--accent:#8ba5ff;--accent2:#202d4b;--good:#34d399;--bad:#fb7185;--shadow:0 8px 28px #0005;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px Inter,system-ui;line-height:1.55}.wrap{max-width:1050px;margin:auto;padding:22px 16px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{background:linear-gradient(135deg,#4263eb,#8b5cf6);color:white;border-radius:13px;width:44px;height:44px;display:grid;place-items:center;font-size:24px;font-weight:700}h1{font-size:1.45rem;margin:0}h1 span{color:var(--accent)}.sub,.muted{color:var(--muted);font-size:.87rem}.actions,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;box-shadow:var(--shadow)}textarea{width:100%;min-height:100px;resize:vertical;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;font:15px 'JetBrains Mono',monospace}textarea:focus,input:focus{outline:2px solid var(--accent);border-color:transparent}.label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}.preview{min-height:42px;padding:8px 12px;background:var(--soft);border:1px dashed var(--line);border-radius:10px;overflow:auto}.btn{border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);padding:8px 12px;cursor:pointer;font-weight:600}.btn:hover{border-color:var(--accent);background:var(--accent2)}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{color:var(--fg)}.chip{border-radius:20px;background:var(--accent2);color:var(--accent);border:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:6px}.grid .btn{font: .85rem 'JetBrains Mono';padding:9px 3px}.result{border:1px solid var(--good);background:color-mix(in srgb,var(--good) 7%,var(--card));border-radius:12px;padding:15px;overflow:auto}.error{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card));color:var(--bad);border-radius:12px;padding:14px}.step{padding:12px 0;border-top:1px solid var(--line);overflow:auto}.step:first-child{border:0}.history{padding:9px;border-top:1px solid var(--line);font:13px 'JetBrains Mono';cursor:pointer;overflow-wrap:anywhere}.history:hover{background:var(--accent2)}.examples{display:flex;gap:7px;flex-wrap:wrap}.hint{font-size:.82rem;color:var(--muted)}@media(max-width:600px){.wrap{padding:14px 10px 40px}header{align-items:flex-start}h1{font-size:1.2rem}.card{padding:13px}}
</style>
</head>
<body><main class="wrap">
<header><div class="brand"><div class="logo">∑</div><div><h1>Omni<span>Math</span> Solver</h1><div class="sub">Scientific calculator · Algebra · Symbolic calculus</div></div></div><div class="actions"><span id="status" class="muted">Loading engines…</span><button class="btn" id="theme">◐ Theme</button></div></header>
<section class="card">
<textarea id="expr" spellcheck="false" placeholder="Try: diff(x^2*sin(x),x)   |   integrate(x^2,x)   |   solve(x^2-5x+6=0,x)"></textarea>
<div class="label">Expression preview</div><div id="preview" class="preview"></div>
<div class="label">Operations</div><div id="ops" class="row"></div>
<div class="label">Scientific keypad</div><div id="keys" class="grid"></div>
<div class="row" style="margin-top:14px"><button class="btn primary" id="solve">Solve / Evaluate</button><button class="btn" id="clear">Clear</button><button class="btn" id="back">⌫ Backspace</button><button class="btn" id="copy">Copy result</button></div>
<div class="label">Examples</div><div id="examples" class="examples"></div>
<div class="hint" style="margin-top:12px">Use * for multiplication when needed. Trigonometric functions use radians by default. Use sin(30 deg) for degrees. Constants: pi, e, i.</div>
</section>
<div id="output"></div>
<section class="card"><div class="row" style="justify-content:space-between"><b>History</b><button class="btn" id="clearHistory">Clear history</button></div><div id="history"></div></section>
</main>
<script>
(()=> {
'use strict';
const $=id=>document.getElementById(id);
let history=[],lastAnswer='0',memory=0;
const examples=[
['Evaluate','(3+5)^2/4'],['Derivative','diff(x^3*sin(x),x)'],['Partial derivative','partial(x^2*y+sin(x*y),x)'],
['Integral','integrate(3*x^2+2*x,x)'],['Definite integral','integrate(sin(x),x,0,pi)'],
['Equation','solve(x^2-5*x+6=0,x)'],['Limit','limit(sin(x)/x,x,0)'],
['Taylor series','taylor(exp(x),x,0,5)'],['Logarithms','log(8,2)+log10(1000)+ln(e^2)'],
['Matrix determinant','det([[2,1],[5,3]])'],['Simplify','simplify((x^2-1)/(x-1))']
];
const keys=['7','8','9','/','(',')','4','5','6','*','^','sqrt(','1','2','3','-','pi','e','0','.','=','+','sin(','cos(','tan(','ln(','log10(','abs(','asin(','acos(','atan(','!','ans'];
const ops=[['d/dx','diff('],['∂ partial','partial('],['∫ integral','integrate('],['Limit','limit('],['Solve','solve('],['Taylor','taylor('],['Gradient','grad(']];
function insert(s){const t=$('expr'),a=t.selectionStart,z=t.selectionEnd;t.value=t.value.slice(0,a)+s+t.value.slice(z);t.focus();t.setSelectionRange(a+s.length,a+s.length);preview()}
function splitArgs(s){let depth=0,parts=[],start=0;for(let i=0;i<s.length;i++){if('([{'.includes(s[i]))depth++;else if(')]}'.includes(s[i]))depth--;else if(s[i]===','&&depth===0){parts.push(s.slice(start,i).trim());start=i+1}}parts.push(s.slice(start).trim());return parts}
function normalize(s){
 return s.trim().replace(/[×·]/g,'*').replace(/[÷]/g,'/').replace(/[−–]/g,'-').replace(/π/g,'pi').replace(/∞/g,'Infinity').replace(/√\s*\(/g,'sqrt(').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\bAns\b/gi,'('+lastAnswer+')').replace(/\bln\s*\(/g,'log(').replace(/\blog10\s*\(/g,'(log(10,10)+0)*log10(');
}
function cleanExpr(s){return normalize(s).replace(/\blog10\s*\(/g,'log10(')}
function tex(s){try{return nerdamer(String(s)).toTeX()}catch(e){try{return math.parse(String(s)).toTex()}catch(_){return '\\text{'+String(s).replace(/[{}\\]/g,'')+'}'}}}
function variables(s){try{let v=[];math.parse(s).traverse(n=>{if(n.isSymbolNode&&!['pi','e','i','Infinity','true','false'].includes(n.name))v.push(n.name)});return [...new Set(v)]}catch(e){return []}}
function numeric(s,scope={}){return math.evaluate(cleanExpr(s),scope)}
function symbolic(s){return nerdamer(cleanExpr(s)).toString()}
function result(answer,steps=[],plain=answer){return {answer,steps,plain}}
function solveExpression(raw){
 const s=cleanExpr(raw);
 const m=s.match(/^([a-z]+)\s*\(([\s\S]*)\)$/i);
 if(m){
  const op=m[1].toLowerCase(),a=splitArgs(m[2]),f=a[0],v=a[1]||variables(f)[0]||'x';
  if(['diff','derivative','differentiate'].includes(op)){const r=nerdamer.diff(f,v).toString();return result(tex(r),[['Differentiate with respect to '+v,tex('diff('+f+','+v+')')],['Simplified derivative',tex(r)]],r)}
  if(['partial','pdiff'].includes(op)){let r=f,st=[];for(const variable of a.slice(1)){r=nerdamer.diff(r,variable).toString();st.push(['Differentiate partially with respect to '+variable,tex(r)])}if(!st.length)throw Error('Add a variable, e.g. partial(x^2*y,x).');return result(tex(r),st,r)}
  if(op==='grad'){let st=[],g=a.slice(1).map(x=>{let d=nerdamer.diff(f,x).toString();st.push(['∂f/∂'+x,tex(d)]);return d});if(!g.length)throw Error('Use grad(expression,x,y,...)');return result('\\left('+g.map(tex).join(',\\ ')+'\\right)',st,'('+g.join(', ')+')')}
  if(['integrate','int'].includes(op)){
   let F;try{F=nerdamer.integrate(f,v).toString()}catch(e){F='integrate('+f+','+v+')'}
   if(a.length>=4){let lo=numeric(a[2]),hi=numeric(a[3]),fn=x=>{try{return numeric(f,{[v]:x})}catch(e){return NaN}},n=4000,h=(hi-lo)/n,sum=fn(lo)+fn(hi);for(let i=1;i<n;i++)sum+=(i%2?4:2)*fn(lo+i*h);let val=sum*h/3;if(!Number.isFinite(val))throw Error('Could not numerically evaluate the integrand over these bounds.');return result(tex(String(Number(val.toPrecision(12)))),[['Set up definite integral',tex('integrate('+f+','+v+','+a[2]+','+a[3]+')')],['Evaluate using composite Simpson’s rule',String(Number(val.toPrecision(12)))]],String(val))}
   if(F.includes('integrate('))throw Error('No closed-form antiderivative found by the symbolic engine.');return result(tex(F)+'+C',[['Find an antiderivative',tex(F)],['Add the constant of integration','+C']],F+' + C')
  }
  if(['solve'].includes(op)){let eq=f;if(!eq.includes('='))eq+='=0';let sides=eq.split('=');if(sides.length!==2)throw Error('Enter one equation with a single equals sign.');let expr='('+sides[0]+')-('+sides[1]+')';let variable=a[1]||variables(expr)[0]||'x';let sol=nerdamer.solve(expr+'=0',variable).toString();return result(tex(sol),[['Rearrange the equation to one side',tex(expr+'=0')],['Solve for '+variable,tex(sol)]],sol)}
  if(['limit','lim'].includes(op)){let p=a[2]||'0',r=nerdamer('limit('+f+','+v+','+p+')').toString();return result(tex(r),[['Evaluate the limit as '+v+' approaches '+p,tex(r)]],r)}
  if(op==='taylor'){let p=a[2]||'0',degree=Number(a[3]||5);if(!Number.isInteger(degree)||degree<0||degree>15)throw Error('Taylor degree must be an integer from 0 to 15.');let cur=f,terms=[],pval=numeric(p);for(let k=0;k<=degree;k++){let c=nerdamer(cur,{[v]:String(pval)}).evaluate().toString();if(c!=='0')terms.push('('+c+')*('+v+'-('+pval+'))^'+k+'/'+math.factorial(k));if(k<degree)cur=nerdamer.diff(cur,v).toString()}let r=nerdamer(terms.join('+')||'0').expand().toString();return result(tex(r),[['Taylor polynomial about '+p+' (degree '+degree+')',tex(r)]],r)}
  if(op==='simplify'||op==='factor'||op==='expand'){let r=nerdamer(op+'('+f+')').toString();return result(tex(r),[[op.charAt(0).toUpperCase()+op.slice(1),tex(r)]],r)}
  if(op==='log10')return result(tex(Math.log10(numeric(f))),[['Common logarithm',String(Math.log10(numeric(f)))]],String(Math.log10(numeric(f))));
 }
 if(s.includes('=')){let eq=s.split('=');if(eq.length!==2)throw Error('Use one equals sign for an equation.');return solveExpression('solve('+s+','+(variables(s)[0]||'x')+')')}
 try{let val=numeric(s);if(typeof val!=='function'&&val!==undefined){let p=math.format(val,{precision:12});return result(tex(p),[['Evaluate the expression',tex(p)]],p)}}catch(e){/* try symbolic next */}
 try{let r=symbolic(s);if(r&&!r.includes('undefined'))return result(tex(r),[['Symbolic simplification',tex(r)]],r)}catch(e){}
 throw Error('This expression could not be parsed. Check brackets, commas and function names. For multiplication, use * (example: 2*x).');
}
function show(res,query){lastAnswer=res.plain;$('output').innerHTML='<section class="card"><div class="label">Final result</div><div class="result">\\['+res.answer+'\\]</div><div class="label">Working</div>'+res.steps.map((s,i)=>'<div class="step"><b>'+(i+1)+'. '+s[0]+'</b><div>\\['+(s[1]||'')+'\\]</div></div>').join('')+'</section>';if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$ ('output')]).catch(()=>{});history.unshift({query,res});history=history.slice(0,20);renderHistory()}
function run(){if(!window.math||!window.nerdamer){$('output').innerHTML='<section class="card error">Math engines are still loading. Check your internet connection and refresh.</section>';return}let q=$('expr').value.trim();if(!q)return;try{show(solveExpression(q),q)}catch(e){$('output').innerHTML='<section class="card error"><b>Unable to solve</b><div>'+String(e.message||e).replace(/[<>]/g,'')+'</div></section>'}}
function renderHistory(){$('history').innerHTML=history.map((h,i)=>'<div class="history" data-i="'+i+'">'+h.query+' <span class="muted">→ '+String(h.res.plain).slice(0,90)+'</span></div>').join('');$('history').querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{$('expr').value=history[+el.dataset.i].query;preview()})}
function preview(){let s=$('expr').value.trim();$('preview').textContent=s?'\\('+s.replace(/</g,'&lt;')+'\\)':'';if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$ ('preview')]).catch(()=>{})}
function init(){if(!window.math||!window.nerdamer){$('status').textContent='Engine load failed';$('status').style.color='var(--bad)'}else $('status').textContent='Engines ready';keys.forEach(k=>{let b=document.createElement('button');b.className='btn';b.textContent=k;b.onclick=()=>k==='='?run():insert(k==='ans'?'Ans':k)});ops.forEach(([l,v])=>{let b=document.createElement('button');b.className='btn chip';b.textContent=l;b.onclick=()=>insert(v);$('ops').append(b)});examples.forEach(([l,v])=>{let b=document.createElement('button');b.className='btn';b.textContent=l;b.onclick=()=>{$('expr').value=v;preview();run()};$('examples').append(b)});$('solve').onclick=run;$('expr').addEventListener('input',preview);$('expr').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();run()}});$('clear').onclick=()=>{$('expr').value='';$('output').innerHTML='';preview()};$('back').onclick=()=>{let t=$('expr'),a=t.selectionStart,z=t.selectionEnd;if(a===z&&a>0)a--;t.setRangeText('',a,z,'end');preview()};$('theme').onclick=()=>document.documentElement.classList.toggle('dark');$('clearHistory').onclick=()=>{history=[];renderHistory()};$('copy').onclick=()=>{if(lastAnswer)navigator.clipboard?.writeText(lastAnswer)}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body></html>
