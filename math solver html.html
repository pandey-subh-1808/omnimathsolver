<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OmniMath Pro — Symbolic CAS & Scientific Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--card:#ffffff;--card2:#f8fafc;--fg:#0f172a;--muted:#64748b;
  --line:#e2e8f0;--acc:#3b82f6;--acc2:#eff6ff;--purple:#8b5cf6;
  --ok:#059669;--okbg:#ecfdf5;--err:#dc2626;--errbg:#fef2f2;
  --shadow:0 4px 20px -2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b0f19;--card:#131926;--card2:#192132;--fg:#f1f5f9;--muted:#94a3b8;
  --line:#243044;--acc:#60a5fa;--acc2:#1e293b;--purple:#a78bfa;
  --ok:#34d399;--okbg:#064e3b;--err:#f87171;--errbg:#450a0a;
  --shadow:0 8px 28px -4px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.55;transition:background .2s,color .2s}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 72px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--purple));color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.25rem}
h1{font-size:1.55rem;letter-spacing:-.025em;margin:0}
h1 span{background:linear-gradient(90deg,var(--acc),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:2px 0 0;font-size:.88rem}
.hdr-actions{display:flex;gap:8px;align-items:center}
.status-pill{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.status-pill.warn{background:var(--errbg);color:var(--err);border-color:var(--err)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;margin-top:6px;position:sticky;top:0;z-index:10;background:var(--bg)}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:7px 14px;cursor:pointer;font-size:.85rem;font-weight:600}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .tab.on{color:#0b0f19}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px;box-shadow:var(--shadow)}
textarea{width:100%;min-height:84px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card2);color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:15px}
textarea:focus{outline:none;border-color:var(--acc)}
.lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center}
#prev{min-height:38px;padding:6px 12px;border-radius:10px;background:var(--card2);border:1px dashed var(--line);overflow-x:auto;display:flex;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:.85rem;font-weight:500}
.btn:hover{border-color:var(--acc);background:var(--acc2)}
.primary{background:linear-gradient(135deg,var(--acc),var(--purple));color:#fff !important;border:none;font-weight:700;padding:9px 22px}
.chip{border-radius:99px;background:var(--acc2);border-color:transparent;font-size:.8rem;color:var(--acc);font-weight:600}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px;margin-top:6px}
.calc-grid .btn{padding:8px 4px;font-size:.82rem;font-family:'JetBrains Mono',monospace;text-align:center;background:var(--card2)}
.calc-grid .btn.op{color:var(--acc);font-weight:700}
.calc-grid .btn.adv{color:var(--purple);font-weight:600;background:var(--acc2)}
.calc-grid .btn.mem{font-size:.76rem;color:var(--muted)}
.ans{background:linear-gradient(135deg,var(--okbg),var(--card));border:1.5px solid var(--ok);border-radius:12px;padding:14px 16px;overflow-x:auto}
.ans .lbl{color:var(--ok);margin-top:0}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-size:.8rem;font-weight:700;display:grid;place-items:center;margin-top:2px}
:root[data-theme="dark"] .n{color:#0b0f19}
.step div{min-width:0;overflow-x:auto;flex:1}
.rule-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.75rem;font-weight:700;background:var(--acc2);color:var(--acc);margin-right:6px}
.err-box{background:var(--errbg);border:1px solid var(--err);color:var(--err);border-radius:12px;padding:14px}
canvas{width:100%;height:300px;display:block;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border-top:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:.84rem;cursor:pointer}
.hist:first-child{border-top:0}
.hist:hover{background:var(--acc2);color:var(--acc)}
.panel[hidden]{display:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:10px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fc code{display:block;max-width:100%;overflow-x:auto;white-space:nowrap;background:var(--acc2);color:var(--acc);padding:3px 8px;border-radius:6px;font:.82rem 'JetBrains Mono',monospace}
.srch{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--card);color:var(--fg);font:inherit;margin:8px 0}
.note{font-size:.86rem;color:var(--muted)}
</style>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Extra.js"></script>
<script src="solver.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">∑</div>
      <div>
        <h1>Omni<span>Math</span> Pro</h1>
        <p class="sub">Symbolic Calculus, Partial Derivatives, Logarithms &amp; Scientific Calculator</p>
      </div>
    </div>
    <div class="hdr-actions">
      <span id="cas-status" class="status-pill">CAS Ready</span>
      <button class="btn" id="theme" aria-label="Toggle theme">◐ Theme</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <section class="panel" id="p-solve">
    <div class="card">
      <textarea id="in" spellcheck="false" placeholder="Enter expression, derivative, partial, integral, logarithm, matrix, or equation…"></textarea>
      <div class="lbl"><span>Live LaTeX Preview</span><span id="mem-ind" style="color:var(--acc)"></span></div>
      <div id="prev"></div>
      <div class="lbl"><span>Calculus, Partials &amp; Advanced CAS</span></div>
      <div class="row" id="syms"></div>
      <div class="lbl">
        <span>Full Scientific Calculator Keypad</span>
        <button class="btn" id="toggle-pad" style="padding:2px 8px;font-size:.75rem">Hide Keypad</button>
      </div>
      <div id="pad-wrap"><div class="calc-grid" id="keys"></div></div>
      <div class="row" style="margin-top:14px;align-items:center">
        <button class="btn primary" id="go">Solve / Evaluate</button>
        <button class="btn" id="clr">Clear</button>
        <button class="btn" id="bksp">⌫ Backspace</button>
      </div>
      <div class="lbl"><span>Quick Examples</span></div>
      <div class="row" id="ex"></div>
    </div>

    <div id="out"></div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>History</strong>
        <button class="btn" id="hclr">Clear</button>
      </div>
      <div id="hist" style="margin-top:8px"></div>
    </div>
  </section>

  <section class="panel" id="p-fn" hidden></section>
</div>
</body>
</html>
